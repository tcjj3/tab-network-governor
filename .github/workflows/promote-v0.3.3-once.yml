name: Promote v0.3.3 to stable (one-shot)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-v0.3.3-once.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote v0.3.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.3.3             --repo "$GITHUB_REPOSITORY"             --prerelease=false
